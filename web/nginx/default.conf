# nginx server block for the Muninn browser vault (copied to
# /etc/nginx/conf.d/default.conf by Dockerfile.web). Serves the wasm bundle
# built by scripts/web-build.sh in /usr/share/nginx/html on port 80.
# The stock nginx.conf of the image still provides mime.types, sendfile and
# logging; this file replaces only the server block.
#
# The bundle is a page plus a worker: index.html, app.js (wasm-bindgen glue),
# app_bg.wasm, worker.js (the sync worker shim), worker/ (the worker's
# wasm-bindgen output and snippets), the three Inter faces and the page's
# wasm-bindgen snippets/ modules. Only app.js, app_bg.wasm, worker.js, worker/
# and snippets/ change per build, and they keep their names, so they must
# revalidate (no-cache + the ETag nginx computes) instead of being cached for
# a year. The fonts keep
# stable names but can change on a Rune bump, so a week rather than immutable.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Behind Traefik (and possibly Cloudflare) in a self-hosted deployment:
    # emit relative Location headers so a redirect keeps the outer scheme.
    absolute_redirect off;

    # app_bg.wasm is about 15 MB raw and 5.6 MB gzipped. Dockerfile.web writes
    # app_bg.wasm.gz and app.js.gz next to the originals, so the common path
    # is a pre-compressed file with no per-request CPU. gzip stays on as the
    # fallback for HTML and anything without a .gz variant. The stock nginx
    # image has no brotli module, so gzip is what we ship.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_static on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/javascript
               text/css text/plain application/json application/xml
               image/svg+xml;

    # index.html and unknown paths: always revalidate so a deploy is visible
    # on the next load.
    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # wasm-bindgen's output. The stock mime.types already maps wasm to
    # application/wasm; declare it here too so the bundle does not depend on
    # the nginx image's table. `types` in a location replaces the inherited
    # table for that location only, and this location serves nothing else.
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # app.js and the snippets/ modules are rebuilt with every wasm build under
    # the same names: revalidate, do not cache.
    location ~* \.(?:js|mjs)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # The Inter faces app.js fetches after the first frame. Stable names, but
    # their bytes follow the pinned Rune revision, so cache for a week and
    # let a deploy replace them without a name change. The stock mime.types
    # has no .ttf/.otf entry (only woff/woff2), so declare the font table
    # here; without it nginx would send application/octet-stream.
    location ~* \.(?:ttf|otf|woff2?)$ {
        types {
            font/ttf  ttf;
            font/otf  otf;
            font/woff woff;
            font/woff2 woff2;
        }
        default_type font/ttf;
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # The GoForge health check does GET / and wants a 2xx; the location above
    # answers with index.html. Keep the stock image's 50x page for the rare
    # upstream failure.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
