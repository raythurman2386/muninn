[workspace]
resolver = "3"
members = [
    "crates/muninn-core",
    "crates/muninn-graph",
    "crates/muninn-i18n",
    "crates/muninn-import",
    "crates/muninn-sync",
    "crates/muninn-ui",
    "crates/muninn-app",
    "crates/muninn-web",
    "xtask",
]
default-members = ["crates/muninn-app"]
# The cargo-fuzz crate is its own workspace: it needs nightly and a separate
# lockfile, so it must not join the product build.
exclude = [
    "fuzz",
    "vendor/accesskit_atspi_common",
    "vendor/accesskit_macos",
    "vendor/accesskit_windows",
    "vendor/naga",
    "vendor/parley_engine",
    "vendor/sctk-adwaita",
    "vendor/wgpu-hal",
    "vendor/winit",
]

[workspace.package]
version = "0.11.5"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/raythurman2386/muninn"
authors = ["Muninn contributors"]

[workspace.dependencies]
muninn-core = { path = "crates/muninn-core", version = "0.11.5" }
muninn-graph = { path = "crates/muninn-graph", version = "0.11.5" }
muninn-i18n = { path = "crates/muninn-i18n", version = "0.11.5" }
muninn-import = { path = "crates/muninn-import", version = "0.11.5" }
muninn-sync = { path = "crates/muninn-sync", version = "0.11.5" }
muninn-ui = { path = "crates/muninn-ui", version = "0.11.5" }

# Exact pin while pre-1.0: conversion output and the parser limits are part of
# the import contract, so a patch release is reviewed rather than floated in.
anydoc = "=0.2.5"

# Rune is a young framework and is not published to crates.io. Pin the exact revision the app
# was built and tested against. For local Rune development, run `./scripts/use-local-rune.sh`.
# 68d1f4dc is the first rev with the full upstream RTL set (Rune #1059: `El::dir`, logical
# `Align::{Start,End}`, mirrored containers, AccessKit direction) plus `Cx::locale` /
# `Cx::system_languages` / `Runtime::set_languages` and the web `dir`/`lang` mirror (Rune #2053).
rune = { git = "https://github.com/anomalyco/rune.git", rev = "68d1f4dc45d3d5f08612e2a463a43c9e9b76432e" }
rune-kit = { git = "https://github.com/anomalyco/rune.git", rev = "68d1f4dc45d3d5f08612e2a463a43c9e9b76432e", features = ["markdown"] }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune.git", rev = "68d1f4dc45d3d5f08612e2a463a43c9e9b76432e" }
# Effect layers painted into `El::effect` slots (graph presets, the delete burn).
# Same pinned revision as `rune`; the compositor in `muninn-app` owns the renderer.
rune-fx = { git = "https://github.com/anomalyco/rune.git", rev = "68d1f4dc45d3d5f08612e2a463a43c9e9b76432e" }

serde_json = { version = "1", features = ["float_roundtrip"] }
# The compositor in `muninn-app` talks to the device and pass types Rune hands it.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl"] }

# Rune's own `[patch.crates-io]`, which a dependency's patch table does not
# apply to the workspace that depends on it (Rune's Cargo.toml: "apps that
# build Rune patch these too"). Each path is a copy of `vendor/<name>` from
# Rune at the pinned rev; re-copy them when the pin moves. They are kept in
# `exclude` above so their tests and lints don't join this workspace.
[patch.crates-io]
# `line-dictionaries` (Thai/Lao/Khmer/Burmese line breaks) and UAX #9 L1; the
# published 0.12.0 has no such feature, so resolution fails without this.
parley_engine = { path = "vendor/parley_engine" }
# `WindowExtWayland::content_corner_radius` on Linux, the macOS IME helpers
# (`set_ime_text`, `take_ime_clauses`), and `warm_keyboard_layout` on Windows.
winit = { path = "vendor/winit" }
# `AdwaitaFrame::content_corner_radius`, called by the patched winit on Wayland.
sctk-adwaita = { path = "vendor/sctk-adwaita" }
# DX12 `Surface::set_present_rects` and `Instance::expose_adapter` (Windows).
wgpu-hal = { path = "vendor/wgpu-hal" }
# `Statement::Emit` range remapping when constant-folding moves an expression to an earlier
# handle: without it the emit neither stretches backwards (`ExpressionAlreadyInScope`) nor
# inverts (`NotInScope`).
naga = { path = "vendor/naga" }
# Heading/landmark UIA and >64 KiB text-run support (Windows accessibility).
accesskit_windows = { path = "vendor/accesskit_windows" }
# Levelled items report their own `size_of_set` to AT-SPI instead of the container's.
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common" }
# `AXHeading` levels and off-main-thread safety (macOS accessibility).
accesskit_macos = { path = "vendor/accesskit_macos" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Rune is large; dependency debug info is not worth the link time during development.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 16
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
