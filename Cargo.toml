[workspace]
resolver = "3"
members = [
    "crates/muninn-core",
    "crates/muninn-graph",
    "crates/muninn-ui",
    "crates/muninn-app",
    "xtask",
]
default-members = ["crates/muninn-app"]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/raythurman2386/muninn"
authors = ["Muninn contributors"]

[workspace.dependencies]
muninn-core = { path = "crates/muninn-core", version = "0.5.1" }
muninn-graph = { path = "crates/muninn-graph", version = "0.5.1" }
muninn-ui = { path = "crates/muninn-ui", version = "0.5.1" }

# Rune is a young framework and is not published to crates.io. Pin the exact revision the app
# was built and tested against. For local Rune development, run `./scripts/use-local-rune.sh`.
rune = { git = "https://github.com/anomalyco/rune.git", rev = "3ff3cc6152b9034a1d996e3a5575c51fab3b56b8" }
rune-kit = { git = "https://github.com/anomalyco/rune.git", rev = "3ff3cc6152b9034a1d996e3a5575c51fab3b56b8", features = ["markdown"] }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune.git", rev = "3ff3cc6152b9034a1d996e3a5575c51fab3b56b8" }
rune-fx = { git = "https://github.com/anomalyco/rune.git", rev = "3ff3cc6152b9034a1d996e3a5575c51fab3b56b8" }

serde_json = "1"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Rune is large; dependency debug info is not worth the link time during development.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 16
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
