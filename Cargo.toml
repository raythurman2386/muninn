[workspace]
resolver = "3"
members = [
    "crates/muninn-core",
    "crates/muninn-graph",
    "crates/muninn-i18n",
    "crates/muninn-sync",
    "crates/muninn-ui",
    "crates/muninn-app",
    "xtask",
]
default-members = ["crates/muninn-app"]

[workspace.package]
version = "0.8.6"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/raythurman2386/muninn"
authors = ["Muninn contributors"]

[workspace.dependencies]
muninn-core = { path = "crates/muninn-core", version = "0.8.6" }
muninn-graph = { path = "crates/muninn-graph", version = "0.8.6" }
muninn-i18n = { path = "crates/muninn-i18n", version = "0.8.6" }
muninn-sync = { path = "crates/muninn-sync", version = "0.8.6" }
muninn-ui = { path = "crates/muninn-ui", version = "0.8.6" }

# Rune is a young framework and is not published to crates.io. Pin the exact revision the app
# was built and tested against. For local Rune development, run `./scripts/use-local-rune.sh`.
rune = { git = "https://github.com/anomalyco/rune.git", rev = "b39c24f7fb588defba035113f3cc8431fae15935" }
rune-kit = { git = "https://github.com/anomalyco/rune.git", rev = "b39c24f7fb588defba035113f3cc8431fae15935", features = ["markdown"] }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune.git", rev = "b39c24f7fb588defba035113f3cc8431fae15935" }
# Effect layers painted into `El::effect` slots (graph presets, the delete burn).
# Same pinned revision as `rune`; the compositor in `muninn-app` owns the renderer.
rune-fx = { git = "https://github.com/anomalyco/rune.git", rev = "b39c24f7fb588defba035113f3cc8431fae15935" }

serde_json = { version = "1", features = ["float_roundtrip"] }
# The compositor in `muninn-app` talks to the device and pass types Rune hands it.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Rune is large; dependency debug info is not worth the link time during development.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 16
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
