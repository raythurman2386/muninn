[package]
name = "muninn-core"
description = "Vault scanning, wikilink parsing, link indexing, board files and kanban notes for Muninn."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Display-side date names. File output keeps its own English table, so this
# edge never changes a written byte (docs/i18n.md §5.4).
muninn-i18n.workspace = true
# Board files are Excalidraw JSON. Already in the workspace (sync, ui, xtask).
serde_json.workspace = true

# Per-note lock envelope (`note_lock`). RustCrypto throughout, so the crypto
# shares the stack `sha1`/`sha2` already use and builds without C toolchains.
# Argon2id derives the key; AES-256-GCM authenticates the payload. The
# `password-hash` and `getrandom` features are not needed: we call
# `hash_password_into` directly and draw the salt/nonce from `getrandom`.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
# Base64url (no padding) keeps the envelope ASCII while staying compact.
base64 = "0.23"
# OS randomness for a fresh salt and nonce on every lock.
getrandom = "0.4"
# Best-effort clearing of derived key material.
zeroize = "1"

# OS-less wasm has no default `getrandom` backend. The browser/Node crypto
# source is pulled only for wasm targets; native builds keep the OS source byte
# for byte. See the wasm32 guard in `xtask wasm-check`.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
# Exposes `muninn_core::testing::TempVault` for tests in other workspace crates.
test-support = []

[lints]
workspace = true
