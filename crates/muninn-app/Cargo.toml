[package]
name = "muninn-app"
description = "Muninn, a local-first Markdown vault with a wikilink graph."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "muninn"
path = "src/main.rs"

[dependencies]
muninn-core.workspace = true
muninn-ui.workspace = true
rune.workspace = true
rune-theme-opencode.workspace = true
serde_json.workspace = true

[dev-dependencies]
muninn-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

[package.metadata.deb]
name = "muninn"
maintainer = "Muninn contributors"
copyright = "2026 Muninn contributors"
license-file = ["../../LICENSE", "1"]
extended-description = """\
A local-first Markdown vault with an Obsidian-style wikilink graph.
Every note is a plain .md file with [[wikilinks]]; Muninn indexes
them and draws the result as a searchable graph with Write/Read/
Graph modes and autosave."""
section = "utils"
priority = "optional"
depends = "libxcb-render0, libxcb-shape0, libxcb-xfixes0, libxkbcommon0, libwayland-client0, libgl1"
assets = [
    ["target/release/muninn", "usr/bin/", "755"],
    ["../../assets/muninn.desktop", "usr/share/applications/", "644"],
    ["../../assets/logo.png", "usr/share/icons/hicolor/512x512/apps/muninn.png", "644"],
    ["../../assets/logo.svg", "usr/share/icons/hicolor/scalable/apps/muninn.svg", "644"],
]
