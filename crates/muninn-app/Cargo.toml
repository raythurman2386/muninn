[package]
name = "muninn-app"
description = "Muninn, a local-first Markdown vault with a wikilink graph."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "muninn"
path = "src/main.rs"

[dependencies]
muninn-core.workspace = true
muninn-ui.workspace = true
rune = { workspace = true, features = ["native-file-dialog"] }
rune-fx.workspace = true
rune-theme-opencode.workspace = true
serde_json.workspace = true
wgpu.workspace = true

[dev-dependencies]
muninn-core = { workspace = true, features = ["test-support"] }

# The Windows console helper (src/win_console.rs) calls Win32 FFI, which needs
# `unsafe`. The workspace uses `forbid`, which cannot be relaxed per module, so
# mirror the workspace lints here with `unsafe_code = "deny"`; that still fails
# any unsafe code in this crate except in win_console.rs, the only module that
# opts out locally. All other lints are unchanged.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[package.metadata.deb]
name = "muninn"
maintainer = "Muninn contributors"
copyright = "2026 Muninn contributors"
license-file = ["../../LICENSE", "1"]
extended-description = """\
A local-first Markdown vault with an Obsidian-style wikilink graph.
Every note is a plain .md file with [[wikilinks]]; Muninn indexes
them and draws the result as a searchable graph with Write/Read/
Graph modes and autosave."""
section = "utils"
priority = "optional"
depends = "libxcb-render0, libxcb-shape0, libxcb-xfixes0, libxkbcommon0, libwayland-client0, libgl1"
assets = [
    ["target/release/muninn", "usr/bin/", "755"],
    ["../../assets/muninn.desktop", "usr/share/applications/", "644"],
    ["../../assets/logo.png", "usr/share/icons/hicolor/512x512/apps/muninn.png", "644"],
    ["../../assets/logo.svg", "usr/share/icons/hicolor/scalable/apps/muninn.svg", "644"],
]
