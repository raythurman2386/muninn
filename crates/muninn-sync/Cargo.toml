[package]
name = "muninn-sync"
description = "Manual, provider-neutral vault sync for Muninn (GitHub, Google Drive, and Tailscale)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
base64 = "0.22"
form_urlencoded = "1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

# `v1` selects the OS store: macOS Keychain, Windows Credential Manager,
# Linux Secret Service via zbus. It does not enable the sample, CLI, or
# SQLite fallback stores.
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[lints]
workspace = true
