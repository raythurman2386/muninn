[package]
name = "muninn-sync"
description = "Manual, provider-neutral vault sync for Muninn (GitHub, Google Drive, and Tailscale)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The host-state seam (slice 8a). Sync keeps small state beside the vault —
# base, journal, prepared list, sha cache, staged bytes — through the same
# string-keyed byte store the rest of the app uses, so the browser twin can
# supply OPFS without a second trait. See `state_home.rs` and the documented
# `muninn-sync → muninn-core` edge in xtask's allowlist.
muninn-core.workspace = true
base64 = "0.23"
form_urlencoded = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
unicode-normalization = "0.1"
url = "2"
zeroize = "1"

# Native-only: blocking HTTP, the OS keyring, and the `getrandom`-backed UUIDs.
# They do not compile for `wasm32-unknown-unknown` as-is, and no module that uses
# them is web-relevant today, so they arrive only with `native`.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
getrandom = { version = "0.4", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

# Web-only: `Date.now()` for the token-expiry clock. `std`'s clock panics on
# `wasm32-unknown-unknown`, and the sync engine compares token expiry before a
# run, so the browser needs the same function backed by the page clock.
js-sys = { version = "0.3", optional = true }

# `v1` selects the OS store: macOS Keychain, Windows Credential Manager,
# Linux Secret Service via zbus. It does not enable the sample, CLI, or
# SQLite fallback stores.
keyring = { version = "4.2.0", default-features = false, features = ["v1"], optional = true }

[features]
# The transports, credential stores, filesystem lease and build-time Google
# Desktop secret. Every module is native today; slices 8-9 carve out the
# web-relevant pieces. `--no-default-features` leaves a near-empty crate that
# compiles for `wasm32-unknown-unknown` and cannot reference the secret.
default = ["native"]
native = ["dep:reqwest", "dep:keyring", "dep:getrandom", "dep:uuid"]

# The browser's PAT transport surface: the HTTP boundary, the GitHub client,
# the credential contract plus its memory store, the journal's state-home API
# and the state-key table. It is deliberately NOT the engine: a run also walks
# and writes the vault, which is still a filesystem operation (see
# `docs/web.md` slice 8). Never enable `native` together with `web` for a wasm
# build, and never enable `native` on `wasm32` at all (`clients.rs` refuses).
web = ["dep:js-sys"]

# Exposes parser seams (`parse_journal_for_fuzzing`,
# `parse_commit_for_fuzzing`) to `fuzz/`. Off by default; the app never
# enables it.
fuzzing = []

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[lints]
workspace = true
