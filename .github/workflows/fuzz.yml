name: Fuzz

# Parsers that read bytes the app did not write, run on a schedule rather than
# on every pull request. See fuzz/README.md.
on:
  workflow_dispatch:
  schedule:
    # Mondays at 04:00 UTC.
    - cron: "0 4 * * 1"

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wikilink, note_lock, sync_json]
    steps:
      - uses: actions/checkout@v7

      - name: Install clang and build tools
        run: sudo scripts/ci/apt-install.sh clang llvm build-essential pkg-config

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Run ${{ matrix.target }} for 120 s
        # cargo-fuzz picks the musl target on Linux, but ASAN needs a
        # dynamically linked libc; pin the GNU host target explicitly.
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=120 -rss_limit_mb=4096

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
