name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt / clippy / test / layers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-targets

      - name: Shell installer test (POSIX sh)
        if: runner.os != 'Windows'
        run: sh scripts/tests/install-sh.sh

      - name: Apt retry test (offline, POSIX sh)
        if: runner.os != 'Windows'
        run: sh scripts/tests/apt-retry.sh

      - name: Layering
        run: cargo run --locked -p xtask -- layers

      - name: i18n copy
        run: cargo run --locked -p xtask -- i18n-lint

      - name: i18n review tool
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts/i18n-review -p 'test_*.py'

  wasm:
    name: wasm32 check (core, graph)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Check core and graph on wasm32
        run: cargo run --locked -p xtask -- wasm-check

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux window dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: cargo doc --locked --workspace --no-deps
