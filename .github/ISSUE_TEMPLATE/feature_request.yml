name: Feature Request
description: Suggest a new feature or enhancement for Muninn
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a Muninn feature!

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What note-taking, linking or graph problem does this feature solve?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work (mode, shortcut, graph behavior, file rule)?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you've considered?

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information, mockups, or examples from other note apps
