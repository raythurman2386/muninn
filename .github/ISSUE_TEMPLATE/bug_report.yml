name: Bug Report
description: Report a bug or unexpected behavior in Muninn
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a Muninn bug!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
      placeholder: What happened in the editor, the reader, or the graph?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Include the smallest vault or note that shows the problem
      placeholder: |
        1. Open a vault containing '...'
        2. Switch to Read / Graph
        3. Click '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Relevant terminal output, panic messages, or screenshots
      render: shell

  - type: input
    id: version
    attributes:
      label: Muninn Version
      description: Release tag or commit, if known
      placeholder: v0.1.0

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information (display/GPU, input device, sample note)
