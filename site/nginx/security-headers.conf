# Security headers, included in every location (add_header in a location replaces inherited ones).
# No Content-Security-Policy yet: the inline no-flash theme script and the Umami host
# (umami-app.ravenwoodsoftware.dev) need a hash-based policy, planned with the W3 SEO/privacy slice.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
