# Security headers, included in every location (add_header in a location replaces inherited ones).
#
# Content-Security-Policy: 'self' plus the self-hosted Umami script and its
# collect endpoint. The only inline script is the no-flash theme setter in
# src/layouts/Base.astro (is:inline); its SHA-256 is listed in script-src.
# Processed page scripts are files under /_astro/ (assetsInlineLimit is 0),
# so they are covered by 'self'. There is no 'unsafe-inline'.
# Recompute the hash after changing the theme script:
#   python3 -c "import pathlib,re,hashlib,base64; h=pathlib.Path('dist/index.html').read_text(); s=re.search(r'<script>([\s\S]*?)</script>', h).group(1); print('sha256-'+base64.b64encode(hashlib.sha256(s.encode()).digest()).decode())"
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-ZGQKVPNc7Tq7jCJlM+lwI7RzmgjqsSNNR6g54LcA+jQ=' https://umami-app.ravenwoodsoftware.dev; style-src 'self'; img-src 'self'; font-src 'self'; media-src 'self'; connect-src 'self' https://umami-app.ravenwoodsoftware.dev; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
