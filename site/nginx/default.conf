# nginx server block for the Muninn marketing site (copied to /etc/nginx/conf.d/default.conf
# by Dockerfile.marketing). Serves the Astro build in /usr/share/nginx/html on port 80.
# The stock nginx.conf of the image still provides mime.types, sendfile and logging.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Behind Traefik + Cloudflare: emit relative Location headers so /foo -> /foo/ keeps https.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json
               application/xml application/rss+xml application/manifest+json image/svg+xml;

    # HTML and anything without a more specific rule: always revalidate.
    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Astro's content-hashed bundles never change under the same name.
    location /_astro/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Fonts, logo, stills and the hero videos keep stable names (they are re-recorded in place),
    # so cache them briefly. Range requests for the .mp4 files are served by nginx's static module.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Branded 404 when the build has one (added in a later slice); until then nginx's own 404 page.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Same as the stock nginx image.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
