# nginx server block for the Muninn marketing site (copied to /etc/nginx/conf.d/default.conf
# by Dockerfile.marketing). Serves the Astro build in /usr/share/nginx/html on port 80.
# The stock nginx.conf of the image still provides mime.types, sendfile and logging.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Behind Traefik + Cloudflare: emit relative Location headers so /foo -> /foo/ keeps https.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json
               application/xml application/rss+xml application/manifest+json image/svg+xml;

    # HTML and anything without a more specific rule: always revalidate.
    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Astro's content-hashed bundles never change under the same name.
    location /_astro/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Fonts, logo, stills and the hero videos keep stable names (they are re-recorded in place),
    # so cache them briefly. Range requests for the video files are served by nginx's static module.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Convenience alias: some tools request /sitemap.xml. The generated file is sitemap-index.xml.
    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        rewrite ^ /sitemap-index.xml last;
    }

    # The web manifest is at the site root; nginx's stock mime.types may not know .webmanifest.
    location = /site.webmanifest {
        try_files $uri =404;
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Favicons at the site root (the official logo, generated by site/scripts/generate-icons.mjs).
    location ~* ^/(favicon\.(ico|svg)|favicon-16x16\.png|favicon-32x32\.png|icon-192x192\.png|icon-512x512\.png|apple-touch-icon\.png)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # image/avif is not always in the stock mime.types of nginx:1.30-alpine.
    location ~* \.avif$ {
        default_type image/avif;
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Branded 404 from the Astro build (site/src/pages/404.astro → dist/404.html).
    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Same as the stock nginx image.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
